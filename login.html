<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Cafeteria e Felicidade</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Cafeteria <span>e Felicidade</span></a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="produtos.html" class="nav-link">Produtos</a>
        <a href="pedidos.html" class="nav-link">Pedidos</a>
        <a href="login.html" class="nav-link active">Login</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="login-container">
      <div class="login-box">
        <h1>Bem-vindo</h1>
        <p>Faça login para acessar sua conta</p>

        <form id="loginForm">
          <div class="field">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="seu@email.com" required />
          </div>

          <div class="field">
            <label>Senha</label>
            <input type="password" id="loginPassword" placeholder="Sua senha" required />
          </div>

          <button type="submit" class="submit-btn">Entrar</button>
        </form>

        <div class="login-footer">
          <p>Não tem conta? <a href="#">Cadastre-se aqui</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logo">Cafeteria <span>e Felicidade</span></div>
      <p>© 2026 Cafeteria e Felicidade. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
